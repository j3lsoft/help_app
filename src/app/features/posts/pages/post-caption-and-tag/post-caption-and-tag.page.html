<ion-header mode="ios" [translucent]="false">
  <ion-toolbar
    class="ion-no-padding"
    color="whiteColor"
    style="box-shadow: 0 2px 3px rgba(0, 0, 0, 0.15)"
  >
    <div
      class="rowAlignCenter"
      style="justify-content: space-between; padding: 15px"
    >
      <ion-icon
        (click)="goBack()"
        name="chevron-back"
        color="blackColor"
        style="font-size: 28px"
      ></ion-icon>
      @if (isPublishing()) {
        <div class="rowAlignCenter" style="gap: 8px">
          <ion-spinner name="crescent"></ion-spinner>
          <ion-text class="blackColor14SemiBold">Publishing…</ion-text>
        </div>
      } @else {
        <ion-text (click)="publish()" class="blackColor14SemiBold">
          Post
        </ion-text>
      }
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="publish()">
    <div class="rowAlignCenter margin20" style="justify-content: space-between">
      <div class="rowAlignCenter" style="flex: 1">
        <img src="assets/images/users/user43.png" class="circleImage" />
        <div class="captionColumn">
          <ion-input
            placeholder="Add a caption..."
            formControlName="caption"
            [maxlength]="captionMaxLength"
            autocapitalize="sentences"
            class="blackColor14Regular"
            style="
              --placeholder-color: var(--grayColor);
              --placeholder-opacity: 1;
              width: 100%;
            "
            mode="ios"
          >
          </ion-input>
          <ion-text class="charCounter">
            {{ captionLength() }}/{{ captionMaxLength }}
          </ion-text>
        </div>
      </div>
      <img
        [src]="selectedImageSrc()"
        style="width: 58px; height: 52px; object-fit: cover; border-radius: 6px"
        [style.filter]="effectiveFilter()"
        [style.transform]="effectiveTransform()"
      />
    </div>

    <div class="rowAlignCenter margin20" style="justify-content: space-between">
      <ion-icon name="pricetag-outline" color="blackColor"></ion-icon>
      <ion-input
        placeholder="Add hashtags..."
        formControlName="tags"
        class="blackColor14Regular tagsInput"
        style="
          --placeholder-color: var(--grayColor);
          --placeholder-opacity: 1;
        "
        mode="ios"
      >
      </ion-input>
    </div>

    <div class="divider"></div>
    <ion-text class="blackColor16Regular" style="margin: 0 20px">
      Tag People
    </ion-text>
    <div class="divider"></div>
    <ion-text class="blackColor16Regular" style="margin: 0 20px">
      Add Location
    </ion-text>
    <div class="divider"></div>
  </form>
</ion-content>
