<article
  class="post-card"
  role="link"
  tabindex="0"
  [attr.aria-label]="'Post by ' + post().userName"
  (click)="openPost()"
  (keydown)="onCardKeydown($event)"
>
  <header class="post-card__masthead">
    <div
      class="post-card__author"
      (click)="$event.stopPropagation(); userClick.emit(post().userName)"
    >
      <span class="post-card__avatar-wrap" aria-hidden="true">
        <span class="post-card__avatar-fallback">{{ authorInitial() }}</span>
        <ion-img
          [src]="post().userProfilePic"
          class="post-card__avatar"
          alt=""
        ></ion-img>
      </span>
      <div class="post-card__author-meta">
        <ion-text class="blackColor14SemiBold post-card__author-name">
          {{ post().userName }}
        </ion-text>
        @if (post().username) {
          <ion-text class="grayColor12Regular post-card__author-username">
            @{{ post().username }}
          </ion-text>
        }
        @if (post().createdAt) {
          <ion-text class="grayColor12Regular post-card__date">
            <span class="post-card__dot" aria-hidden="true">·</span>
            {{ post().createdAt | timeAgo }}
          </ion-text>
        }
      </div>
    </div>
    <button
      type="button"
      class="post-card__options-btn"
      aria-label="Post options"
      (click)="$event.stopPropagation()"
    >
      <ion-icon
        name="ellipsis-vertical"
        color="blackColor"
        class="post-card__options-icon"
        aria-hidden="true"
      ></ion-icon>
    </button>
  </header>

  @if (post().aboutPost) {
    <app-expandable-text [text]="post().aboutPost" class="post-card__body" />
  }

  @if (post().postImages.length > 0) {
    <figure class="post-card__media">
      <app-post-media-carousel
        [images]="post().postImages"
        style="--post-carousel-height: 320px"
      ></app-post-media-carousel>
      @if (post().postImages.length > 1) {
        <figcaption class="post-card__media-count">
          <ion-icon name="images-outline" aria-hidden="true"></ion-icon>
          <span>{{ post().postImages.length }}</span>
        </figcaption>
      }
    </figure>
  }


  <footer class="post-card__actions">
    <button
      type="button"
      class="post-card__action"
      (click)="$event.stopPropagation(); likeClick.emit()"
      [attr.aria-pressed]="post().postLike"
      [attr.aria-label]="post().postLike ? 'Unlike post' : 'Like post'"
    >
      <span
        class="post-card__action-icon-wrap"
        [class.post-card__action-icon-wrap--liked]="post().postLike"
        [class.post-card__action-icon-wrap--burst]="post().postLike"
      >
        <ion-icon
          [name]="post().postLike ? 'heart' : 'heart-outline'"
          [color]="post().postLike ? 'redColor' : 'grayColor'"
          class="post-card__action-icon"
          [class.post-card__action-icon--liked]="post().postLike"
          aria-hidden="true"
        ></ion-icon>
      </span>
      <span
        class="post-card__action-count"
        [class.post-card__action-count--liked]="post().postLike"
      >
        {{ post().postLikes | shortNumber }}
      </span>
    </button>
    <button
      type="button"
      class="post-card__action"
      (click)="$event.stopPropagation(); commentClick.emit()"
      aria-label="View comments"
    >
      <span class="post-card__action-icon-wrap">
        <ion-icon
          name="chatbox-ellipses-outline"
          color="grayColor"
          class="post-card__action-icon"
          aria-hidden="true"
        ></ion-icon>
      </span>
      <span class="post-card__action-count">
        {{ post().postComments | shortNumber }}
      </span>
    </button>
    <button
      type="button"
      class="post-card__action"
      (click)="$event.stopPropagation(); saveClick.emit()"
      [attr.aria-pressed]="!!post().postSaved"
      [attr.aria-label]="post().postSaved ? 'Remove from saved' : 'Save post'"
    >
      <span
        class="post-card__action-icon-wrap"
        [class.post-card__action-icon-wrap--saved]="post().postSaved"
      >
        <ion-icon
          [name]="post().postSaved ? 'bookmark' : 'bookmark-outline'"
          [color]="post().postSaved ? 'secondaryColor' : 'grayColor'"
          class="post-card__action-icon"
          [class.post-card__action-icon--saved]="post().postSaved"
          aria-hidden="true"
        ></ion-icon>
      </span>
      <span
        class="post-card__action-count"
        [class.post-card__action-count--saved]="post().postSaved"
      >
        {{ post().postSaves | shortNumber }}
      </span>
    </button>
    <button
      type="button"
      class="post-card__action"
      (click)="$event.stopPropagation(); shareClick.emit()"
      aria-label="Share post"
    >
      <span class="post-card__action-icon-wrap">
        <ion-icon
          name="share-outline"
          color="grayColor"
          class="post-card__action-icon"
          aria-hidden="true"
        ></ion-icon>
      </span>
    </button>
  </footer>

</article>
