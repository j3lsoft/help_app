<app-back-header
  [title]="userProfile.value()?.username || 'Loading...'"
  (backClick)="goBack()"
></app-back-header>

<ion-content>
  @if (userProfile.isLoading()) {
  <div class="user-profile__loading-container">
    <ion-spinner color="primary"></ion-spinner>
    <ion-text class="user-profile__loading-text">Loading profile...</ion-text>
  </div>
  } @else if (userProfile.error()) {
  <div class="user-profile__error-container">
    <ion-text class="user-profile__error-text">Failed to load profile</ion-text>
  </div>
  } @else if (userProfile.value(); as profile) {
  <app-profile-header
    [name]="profile.displayName"
    [description]="profile.bio ?? ''"
    [website]="stripWebsite(profile.website)"
    [fullWebsiteUrl]="fullWebsiteUrl()"
    [profileImage]="profile.avatarUrl ?? ''"
    [postsCount]="'0'"
    [videosCount]="'0'"
    [followersCount]="followerCount()"
    [followingCount]="followingCount()"
    [storyAvailable]="false"
    (onFollowersClick)="goToFollowers()"
    (onFollowingClick)="goToFollowings()"
  ></app-profile-header>

  <div class="user-profile__actions">
    <app-follow-button
      variant="profile"
      [isFollowing]="isFollowing()"
      [disabled]="isTogglingFollow()"
      (followClick)="toggleFollow()"
    />

    <div
      (click)="goTo('message')"
      class="user-profile__btn user-profile__btn--secondary"
    >
      <ion-text
        class="ellipseText user-profile__btn-text primaryColor18Bold"
      >
        Message
      </ion-text>
    </div>
  </div>

  <app-profile-tabs
    [selectedTab]="selectedTabValue()"
    (tabChange)="onTabChange($event)"
  ></app-profile-tabs>

  <app-profile-post-grid
    [posts]="filteredPosts()"
    (postClick)="goTo('user-posts')"
  ></app-profile-post-grid>
  }
</ion-content>
