<div class="profile-tabs">
  <ion-segment
    [value]="selectedTab()"
    (ionChange)="onTabChange($event)"
    mode="md"
  >
    <ion-segment-button value="posts" aria-label="Posts">
      <ion-icon name="grid-outline" aria-hidden="true"></ion-icon>
    </ion-segment-button>
    <ion-segment-button value="media" aria-label="Media">
      <ion-icon name="images-outline" aria-hidden="true"></ion-icon>
    </ion-segment-button>
  </ion-segment>
</div>
