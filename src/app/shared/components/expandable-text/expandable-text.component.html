<span class="expandable-text">
  <span #content class="expandable-text__content" tabindex="-1">
    @for (segment of segments(); track $index) {
      @if (segment.hashtag) {
        <button
          type="button"
          class="expandable-text__hashtag"
          (click)="$event.stopPropagation(); onHashtagTap(segment.hashtag!)"
        >{{ segment.text }}</button>
      } @else {
        {{ segment.text }}
      }
    }
  </span>@if (isCollapsedView()) {
    <span class="expandable-text__marker" aria-hidden="true">…</span>
  }@if (isCollapsedView()) {
    <button
      type="button"
      class="expandable-text__more"
      (click)="$event.stopPropagation(); expand()"
    >Show more</button>
  }
</span>
