<span class="expandable-text">
  <span #content class="expandable-text__content" tabindex="-1">{{ displayText() }}</span>@if (isCollapsedView()) {
    <span class="expandable-text__marker" aria-hidden="true">…</span>
  }@if (isCollapsedView()) {
    <button
      type="button"
      class="expandable-text__more"
      (click)="$event.stopPropagation(); expand()"
    >Show more</button>
  }
</span>
